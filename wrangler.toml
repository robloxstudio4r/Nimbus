name = "nimbus-store"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Serve everything in ./public as static assets
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 database binding — replace database_id after creating the DB
[[d1_databases]]
binding = "DB"
database_name = "nimbus-db"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"

# Admin password (you can also set this as a secret — see README)
[vars]
ADMIN_PASSWORD = "06142014Aa@"
